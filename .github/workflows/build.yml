name: Build

# Builds the fonts from sources/ with gftools (fontmake under the hood) and a proof page.
# Download the "thira-sans" artifact from the run to get the fonts and proof/.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Build fonts
        run: gftools builder sources/config.yaml
      - name: Variable webfont for the proof page
        run: |
          mkdir -p proof/fonts
          vf=$(ls fonts/variable/*.ttf | head -n 1)
          fonttools ttLib.woff2 compress -o proof/fonts/ThiraSans-VF.woff2 "$vf"
          ls -la fonts/* proof/fonts
      - uses: actions/upload-artifact@v4
        with:
          name: thira-sans
          path: |
            fonts/
            proof/
            OFL.txt
